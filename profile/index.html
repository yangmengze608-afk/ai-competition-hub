<!doctype html>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <style>
    html{scroll-behavior:smooth;background:#000}body{margin:0;background:#000;color:#fff;overflow-x:hidden}*{box-sizing:border-box}::selection{background:rgba(255,255,255,.9);color:#000}
    .liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
    .liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .liquid-glass-strong{background:rgba(255,255,255,.01);background-blend-mode:luminosity;backdrop-filter:blur(50px);-webkit-backdrop-filter:blur(50px);border:none;box-shadow:4px 4px 4px rgba(0,0,0,.05),inset 0 1px 1px rgba(255,255,255,.15);position:relative;overflow:hidden}
    .liquid-glass-strong::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.2) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.2) 80%,rgba(255,255,255,.5) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .video-layer{will-change:opacity}.text-shadow{text-shadow:0 2px 24px rgba(0,0,0,.32)}.safe-bottom{padding-bottom:max(2rem,env(safe-area-inset-bottom))}@media(max-width:767px){.hero-video{width:160%!important;height:125%!important}}

<body class="bg-black font-body">
<div id="root"></div>
<script type="text/babel">
const {useEffect,useRef,useState}=React;
const {motion}=window.Motion;
const originalConsoleError=console.error;console.error=(...args)=>{if(typeof args[0]==='string'&&args[0].includes('Each child in a list should have a unique'))return;originalConsoleError(...args)};
function ArrowUpRight({className='h-5 w-5'}){return <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>}
function PlayIcon({className='h-4 w-4'}){return <svg className={className} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>}
function ClockIcon(){return <svg className="h-7 w-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>}
function GlobeIcon(){return <svg className="h-7 w-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.5 4 5.5 4 9s-1.4 6.5-4 9c-2.6-2.5-4-5.5-4-9s1.4-6.5 4-9Z"/></svg>}
const capabilityIcons={research:'M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21H5Zm1-4h12l-3.75-5-3 4L9 13l-3 4Z',product:'M4 6.47 5.76 10H20v8H4V6.47M22 4h-4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.89-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4Z',data:'M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1Zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7Z'};
function MaterialIcon({path}){return <svg className="h-6 w-6 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d={path}/></svg>}
function FadingVideo({src,className='',style={}}){const videoRef=useRef(null),rafRef=useRef(null),fadingOutRef=useRef(false);useEffect(()=>{const video=videoRef.current;if(!video)return;const FADE_MS=500,FADE_OUT_LEAD=.55;const fadeTo=(target,duration=FADE_MS)=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);const startOpacity=Number.parseFloat(video.style.opacity||'0'),startTime=performance.now();const frame=now=>{const progress=Math.min((now-startTime)/duration,1),eased=1-Math.pow(1-progress,3);video.style.opacity=String(startOpacity+(target-startOpacity)*eased);if(progress<1)rafRef.current=requestAnimationFrame(frame)};rafRef.current=requestAnimationFrame(frame)};const onLoadedData=async()=>{video.style.opacity='0';try{await video.play()}catch(_){}fadeTo(1)};const onTimeUpdate=()=>{const remaining=video.duration-video.currentTime;if(!fadingOutRef.current&&Number.isFinite(remaining)&&remaining<=FADE_OUT_LEAD&&remaining>0){fadingOutRef.current=true;fadeTo(0)}};const onEnded=()=>{video.style.opacity='0';window.setTimeout(async()=>{video.currentTime=0;fadingOutRef.current=false;try{await video.play()}catch(_){}fadeTo(1)},100)};video.addEventListener('loadeddata',onLoadedData);video.addEventListener('timeupdate',onTimeUpdate);video.addEventListener('ended',onEnded);return()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);video.removeEventListener('loadeddata',onLoadedData);video.removeEventListener('timeupdate',onTimeUpdate);video.removeEventListener('ended',onEnded)}},[src]);return <video ref={videoRef} src={src} autoPlay muted playsInline preload="auto" className={`video-layer ${className}`} style={{...style,opacity:0}} aria-hidden="true"/>}
function BlurText({text,className=''}){const [visible,setVisible]=useState(false),ref=useRef(null);useEffect(()=>{const node=ref.current;if(!node)return;const observer=new IntersectionObserver(([entry])=>{if(entry.isIntersecting){setVisible(true);observer.disconnect()}},{threshold:.1});observer.observe(node);return()=>observer.disconnect()},[]);return <p ref={ref} className={`${className} flex flex-wrap justify-center gap-y-[0.1em]`}>{text.split(' ').map((word,i)=><motion.span key={`${word}-${i}`} initial={{filter:'blur(10px)',opacity:0,y:50}} animate={visible?{filter:['blur(10px)','blur(5px)','blur(0px)'],opacity:[0,.5,1],y:[50,-5,0]}:{}} transition={{duration:.7,times:[0,.5,1],ease:'easeOut',delay:i*100/1000}} style={{display:'inline-block',marginRight:'.28em'}}>{word}</motion.span>)}</p>}
const fadeUp={initial:{filter:'blur(10px)',opacity:0,y:20},animate:{filter:'blur(0px)',opacity:1,y:0}};
function Navbar(){const scrollToWork=()=>document.getElementById('capabilities')?.scrollIntoView({behavior:'smooth'});return <header className="fixed left-0 right-0 top-4 z-50 px-8 lg:px-16"><nav className="mx-auto flex max-w-[1500px] items-center justify-between"><a href="#home" aria-label="返回首页" className="liquid-glass grid h-12 w-12 place-items-center rounded-full font-heading text-2xl italic text-white">ym</a><div className="liquid-glass hidden items-center rounded-full px-1.5 py-1.5 md:flex"><a href="#home" className="px-3 py-2 text-sm font-medium text-white/90">Home</a><a href="#capabilities" className="px-3 py-2 text-sm font-medium text-white/90">Focus</a><a href="https://aisaichang.cn/" target="_blank" rel="noreferrer" className="px-3 py-2 text-sm font-medium text-white/90">AI Arena</a><a href="https://github.com/yangmengze608-afk" target="_blank" rel="noreferrer" className="px-3 py-2 text-sm font-medium text-white/90">Research</a><button onClick={()=>window.location.href='mailto:yangmengze608@gmail.com'} className="px-3 py-2 text-sm font-medium text-white/90">Contact</button><button onClick={scrollToWork} className="ml-1 flex items-center gap-2 whitespace-nowrap rounded-full bg-white px-4 py-2 text-sm font-medium text-black">View My Work <ArrowUpRight className="h-4 w-4"/></button></div><div className="h-12 w-12" aria-hidden="true"></div></nav></header>}
function StatCard({icon,number,label}){return <div className="liquid-glass flex w-[220px] flex-col justify-between rounded-[1.25rem] p-5 text-left"><div>{icon}</div><div className="mt-8"><div className="font-heading text-4xl italic leading-none tracking-[-1px] text-white">{number}</div><div className="mt-2 text-xs font-light text-white">{label}</div></div></div>}
function Hero(){return <section id="home" className="relative flex min-h-screen overflow-hidden bg-black"><FadingVideo src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4" className="hero-video absolute left-1/2 top-0 z-0 -translate-x-1/2 object-cover object-top" style={{width:'120%',height:'120%'}}/><div className="relative z-10 flex min-h-screen w-full flex-col"><Navbar/><div className="flex flex-1 flex-col items-center justify-center px-4 pt-24 text-center"><motion.div {...fadeUp} transition={{duration:.7,delay:.4,ease:'easeOut'}} className="liquid-glass flex items-center rounded-full py-1 pl-1 pr-3"><span className="rounded-full bg-white px-3 py-1 text-xs font-semibold text-black">USYD</span><span className="ml-2 text-sm text-white/90">Psychology × Data Science × AI</span></motion.div><BlurText text="Understand People Build Intelligent Systems" className="text-shadow mt-5 max-w-4xl font-heading text-6xl italic leading-[0.8] tracking-[-4px] text-white md:text-7xl lg:text-[5.5rem]"/><motion.p {...fadeUp} transition={{duration:.7,delay:.8,ease:'easeOut'}} className="text-shadow mt-5 max-w-2xl text-sm font-light leading-tight text-white md:text-base">I study how people think, how products are used, and how AI can connect research with real-world problems. My work spans user research, AI product building, and quantitative analysis.</motion.p><motion.div {...fadeUp} transition={{duration:.7,delay:1.1,ease:'easeOut'}} className="mt-6 flex items-center gap-6"><button onClick={()=>document.getElementById('capabilities')?.scrollIntoView({behavior:'smooth'})} className="liquid-glass-strong flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-medium text-white">Explore My Work <ArrowUpRight/></button><a href="https://github.com/yangmengze608-afk" target="_blank" rel="noreferrer" className="flex items-center gap-2 text-sm font-medium text-white">View GitHub <PlayIcon/></a></motion.div><motion.div {...fadeUp} transition={{duration:.7,delay:1.3,ease:'easeOut'}} className="mt-8 flex flex-col items-stretch gap-4 sm:flex-row"><StatCard icon={<ClockIcon/>} number="4 Core" label="Active product and research projects"/><StatCard icon={<GlobeIcon/>} number="2 Fields" label="Psychology and Data Science"/></motion.div></div><motion.div {...fadeUp} transition={{duration:.7,delay:1.4,ease:'easeOut'}} className="safe-bottom flex flex-col items-center gap-4 px-4"><div className="liquid-glass rounded-full px-3.5 py-1 text-xs font-medium text-white">Building at the intersection of people, data, and intelligent systems</div><div className="flex flex-wrap justify-center gap-x-10 gap-y-2 font-heading text-2xl italic tracking-tight text-white md:gap-x-16 md:text-3xl"><span>Psychology</span><span>Data</span><span>AI Product</span><span>Research</span><span>Automation</span></div></motion.div></div></section>}
const capabilities=[{title:'Human Research',icon:capabilityIcons.research,tags:['User Insight','Behavior','Research Design','Evidence'],body:'I translate psychological theory and user behavior into testable questions, structured research, and decisions grounded in evidence.'},{title:'AI Product Building',icon:capabilityIcons.product,tags:['AI Arena','Agent Workflow','Rapid Prototype','Launch'],body:'I turn ambiguous needs into usable AI products—from problem framing and information architecture to prototyping, deployment, and iteration.'},{title:'Data & Quant',icon:capabilityIcons.data,tags:['Python','R','Regression','Backtesting'],body:'I use data analysis to challenge assumptions, test patterns, and build reproducible research workflows across behavioral and financial questions.'}];
function CapabilityCard({item,index}){return <motion.article initial={{opacity:0,y:30,filter:'blur(8px)'}} whileInView={{opacity:1,y:0,filter:'blur(0px)'}} viewport={{once:true,amount:.2}} transition={{duration:.7,delay:index*.12,ease:'easeOut'}} className="liquid-glass flex min-h-[360px] flex-col rounded-[1.25rem] p-6"><div className="flex items-start justify-between gap-4"><div className="liquid-glass grid h-11 w-11 shrink-0 place-items-center rounded-[0.75rem]"><MaterialIcon path={item.icon}/></div><div className="flex max-w-[70%] flex-wrap justify-end gap-1.5">{item.tags.map(tag=><span key={tag} className="liquid-glass whitespace-nowrap rounded-full px-3 py-1 text-[11px] text-white/90">{tag}</span>)}</div></div><div className="flex-1"></div><div className="mt-6"><h3 className="font-heading text-3xl italic leading-none tracking-[-1px] text-white md:text-4xl">{item.title}</h3><p className="mt-3 max-w-[32ch] text-sm font-light leading-snug text-white/90">{item.body}</p></div></motion.article>}
function Capabilities(){return <section id="capabilities" className="relative min-h-screen overflow-hidden bg-black"><FadingVideo src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4" className="absolute inset-0 z-0 h-full w-full object-cover"/><div className="relative z-10 flex min-h-screen flex-col px-8 pb-10 pt-24 md:px-16 lg:px-20"><motion.header initial={{opacity:0,y:20,filter:'blur(8px)'}} whileInView={{opacity:1,y:0,filter:'blur(0px)'}} viewport={{once:true,amount:.3}} transition={{duration:.7,ease:'easeOut'}} className="mb-auto"><p className="mb-6 text-sm text-white/80">// Capabilities</p><h2 className="font-heading text-6xl italic leading-[0.9] tracking-[-3px] text-white md:text-7xl lg:text-[6rem]">Research<br/>evolved</h2></motion.header><div className="mt-16 grid grid-cols-1 gap-6 md:grid-cols-3">{capabilities.map((item,index)=><CapabilityCard key={item.title} item={item} index={index}/>)}</div><div className="mt-8 flex flex-col items-start justify-between gap-4 text-xs text-white/75 md:flex-row md:items-center"><span>Yang Mengze · University of Sydney · 2026</span><div className="flex gap-5"><a href="https://aisaichang.cn/" target="_blank" rel="noreferrer">AI Arena ↗</a><a href="mailto:yangmengze608@gmail.com">Contact ↗</a></div></div></div></section>}
function App(){return <><Hero/><Capabilities/></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
