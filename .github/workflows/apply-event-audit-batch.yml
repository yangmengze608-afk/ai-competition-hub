name: Apply event audit batch

on:
  push:
    branches:
      - 'feature/event-audit-batch-*'
    paths:
      - 'research/audit-batches/event-audit-batch-*.json'
      - 'scripts/apply-event-audit-batch.cjs'
      - '.github/workflows/apply-event-audit-batch.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/audit-batches/event-audit-batch-*.json'
      - 'scripts/apply-event-audit-batch.cjs'
      - '.github/workflows/apply-event-audit-batch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Resolve newest audit batch
        id: batch
        shell: bash
        run: |
          BATCH_FILE=$(find research/audit-batches -maxdepth 1 -type f -name 'event-audit-batch-*.json' | sort -V | tail -n 1)
          if [ -z "$BATCH_FILE" ]; then
            echo 'No event audit batch found.' >&2
            exit 1
          fi
          echo "file=$BATCH_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$BATCH_FILE" .json)" >> "$GITHUB_OUTPUT"
          echo "Applying $BATCH_FILE"

      - name: Apply audit metadata
        run: node scripts/apply-event-audit-batch.cjs "${{ steps.batch.outputs.file }}"

      - name: Generate browser competition data
        run: node scripts/generate-competition-data.cjs

      - name: Audit merged competition data
        run: node scripts/data-audit.cjs

      - name: Commit canonical data update
        run: |
          if git diff --quiet -- data/competitions-v1.json competition-data.generated.js; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/competitions-v1.json competition-data.generated.js
          git commit -m "data: apply ${{ steps.batch.outputs.name }}"
          git push origin HEAD:"${TARGET_BRANCH}"
