name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: find . -path './node_modules' -prune -o -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check

      - name: Verify focused launch segments
        run: node scripts/launch-segments-audit.cjs

      - name: Upload launch segment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-segments-report
          path: launch-segments-report.json
          if-no-files-found: error

      - name: Verify unified competition data
        run: |
          node scripts/generate-competition-data.cjs
          git diff --exit-code -- data/competitions-v1.json competition-data.generated.js

      - name: Audit competition data
        run: node scripts/data-audit.cjs

      - name: Verify playbook data
        run: |
          node scripts/generate-playbook-data.cjs
          git diff --exit-code -- playbook-data.generated.js
          node scripts/playbook-audit.cjs

      - name: Verify competition decision experience
        run: node scripts/detail-decision-audit.cjs

      - name: Verify public conversion entrypoints
        run: node scripts/conversion-audit.cjs

      - name: Verify public trust pages
        run: node scripts/trust-pages-audit.cjs

      - name: Verify privacy analytics boundaries
        run: node scripts/analytics-audit.cjs

      - name: Prevent duplicated source labels
        run: node scripts/source-page-regression.cjs

      - name: Verify production domain SEO
        run: node scripts/seo-audit.cjs

      - name: Smoke test competition library
        shell: bash
        run: |
          set -o pipefail
          node scripts/smoke-test.cjs 2>&1 | tee smoke-test.log

      - name: Upload smoke test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-diagnostics
          path: smoke-test.log
          if-no-files-found: error

      - name: Set up Node for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile Chromium tests
        run: npm run test:e2e

      - name: Upload Chromium test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4