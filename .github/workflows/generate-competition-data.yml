name: Generate unified competition data

on:
  push:
    branches: ["feature/unified-competition-data"]
    paths:
      - "data.js"
      - "real-competitions.js"
      - "expanded-competitions-*.js"
      - "real-competition-config.js"
      - "scripts/generate-competition-data.cjs"
      - ".github/workflows/generate-competition-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-competition-data
          fetch-depth: 0

      - name: Generate JSON and runtime bundle
        run: node scripts/generate-competition-data.cjs

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/competitions-v1.json competition-data.generated.js
          if git diff --cached --quiet; then
            echo "Generated data is already current."
            exit 0
          fi
          git commit -m "build: generate unified competition data"
          git push origin HEAD:feature/unified-competition-data
