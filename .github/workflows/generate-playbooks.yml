name: Generate playbook data

on:
  push:
    branches: ["feature/first-10-playbooks"]
    paths:
      - "data/playbooks-v1.json"
      - "scripts/generate-playbook-data.cjs"
      - ".github/workflows/generate-playbooks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/first-10-playbooks
          fetch-depth: 0
      - name: Generate playbook runtime
        run: node scripts/generate-playbook-data.cjs
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playbook-data.generated.js
          if git diff --cached --quiet; then
            echo "Playbook runtime is already current."
            exit 0
          fi
          git commit -m "build: generate playbook runtime"
          git push origin HEAD:feature/first-10-playbooks
