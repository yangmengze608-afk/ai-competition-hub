name: Apply event audits

on:
  push:
    branches: ["feature/top-20-event-audit"]
    paths:
      - "data/event-audits-v*.json"
      - "scripts/apply-event-audits.cjs"
      - ".github/workflows/apply-event-audits.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/top-20-event-audit
          fetch-depth: 0

      - name: Apply event-level audits
        run: node scripts/apply-event-audits.cjs

      - name: Generate browser data bundle
        run: node scripts/generate-competition-data.cjs

      - name: Validate data and application
        run: |
          node scripts/data-audit.cjs
          node scripts/smoke-test.cjs

      - name: Commit audited data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/competitions-v1.json competition-data.generated.js
          if git diff --cached --quiet; then
            echo "Audited data is already current."
            exit 0
          fi
          git commit -m "data: apply event-level audits"
          git push origin HEAD:feature/top-20-event-audit
